name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regression tests
        run: php tests/run.php
      - name: Submission identity checks
        run: php tests/identity.php
      - name: SDN coexistence checks
        run: php tests/measurement.php
      - name: Admin save flow checks
        run: php tests/admin-flow.php
      - name: Translation checks
        run: |
          if ! command -v msgfmt >/dev/null; then sudo apt-get update && sudo apt-get install -y gettext; fi
          python3 tests/translations.py
      - name: PHP syntax
        run: find wordpress-plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build installable ZIP
        run: bash bin/build.sh
